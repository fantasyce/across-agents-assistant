[project]
name = "across-agents-assistant"
version = "0.13.0"
description = "macOS desktop assistant with a Swift client, local Python backend, project chat, and agent orchestration"
requires-python = ">=3.10,<3.14"
dependencies = [
  "edge-tts>=7.0.0",
  "pynput>=1.7.0",
  "pywebview>=4.4",
  "requests>=2.31.0",
]

[project.optional-dependencies]
mac-ui = [
  "pyobjc-framework-AppKit>=10.0",
  "pyobjc-framework-Vision>=10.0",
]

[project.scripts]
across-agents-assistant = "across_agents_assistant.cli:main"
across-worker-model-gateway = "across_agents_assistant.worker_model_gateway:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
