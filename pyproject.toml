[project]
name = "multi-agents-assistant"
version = "0.1.0"
description = "macOS voice assistant based on SpeechCLI + OpenClaw + interruptible TTS"
requires-python = ">=3.10"
dependencies = [
  "edge-tts>=7.0.0",
  "pynput>=1.7.0",
  "requests>=2.31.0",
  "pyobjc-framework-AppKit>=10.0",
]

[project.scripts]
multi-agents-assistant = "multi_agents_assistant.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

