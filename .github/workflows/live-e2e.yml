name: Live E2E

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "E2E tier to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - minimal
          - rest-api
          - complex

jobs:
  live-e2e:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_no_pyobjc.txt

      - name: Install Across Orchestrator
        run: |
          python -m pip install "git+https://github.com/fantasyce/across-orchestrator.git@v0.10.8"

      - name: Run live E2E
        env:
          PYTHON: python
        run: |
          ORCHESTRATOR_COMMAND="$(python -c 'import shutil, sys; command = shutil.which("across-orchestrator"); sys.exit("across-orchestrator not found on PATH") if not command else print(command)')"
          EVIDENCE_PATH="${RUNNER_TEMP}/github-live-e2e-gate-evidence.json"
          ACROSS_AGENTS_ORCHESTRATOR_COMMAND="$ORCHESTRATOR_COMMAND" \
            ACROSS_AGENTS_LIVE_E2E_GATE_ID="github_live_e2e" \
            ACROSS_AGENTS_LIVE_E2E_EVIDENCE_PATH="$EVIDENCE_PATH" \
            bash scripts/run_live_e2e.sh "${{ inputs.tier }}"

      - name: Upload live E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-gate-evidence
          path: ${{ runner.temp }}/github-live-e2e-gate-evidence.json
          if-no-files-found: warn
