name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  open-source-and-regression:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_no_pyobjc.txt

      - name: Open-source repository check
        run: bash scripts/open_source_check.sh

      - name: Backend regression
        env:
          PYTHONPATH: backend/src
        run: |
          pytest -q backend/tests --ignore=backend/tests/e2e

      - name: Swift package lock consistency
        run: bash scripts/verify_swift_package_lock.sh

      - name: Swift build
        run: swift build --package-path macOS-Client --skip-update

      - name: Swift behavior checks
        run: bash scripts/run_swift_behavior_checks.sh

      - name: Write Quality CI evidence
        if: success()
        env:
          ACROSS_AGENTS_PRE_RELEASE_GATE_EVIDENCE_PATH: ${{ runner.temp }}/quality_ci-gate-evidence.json
          ACROSS_AGENTS_PRE_RELEASE_GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACROSS_AGENTS_PRE_RELEASE_GATE_COMMIT_SHA: ${{ github.sha }}
        run: |
          bash scripts/write_pre_release_gate_evidence.sh quality_ci passed github_actions "Quality CI passed."

      - name: Upload Quality CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-ci-gate-evidence
          path: ${{ runner.temp }}/quality_ci-gate-evidence.json
          if-no-files-found: warn
