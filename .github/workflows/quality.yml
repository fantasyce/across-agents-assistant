name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  open-source-and-regression:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_no_pyobjc.txt

      - name: Open-source repository check
        run: bash scripts/open_source_check.sh

      - name: Backend regression
        env:
          PYTHONPATH: backend/src
        run: |
          pytest -q backend/tests --ignore=backend/tests/e2e

      - name: Swift build
        run: swift build --package-path macOS-Client --skip-update
